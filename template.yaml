AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Flostat Flow Meter Backend Serverless Stack

Parameters:
  FlowDeviceTableName:
    Type: String
    Description: Existing DynamoDB table for flow device data (e.g., flostat-jitendera)
  FlowMeterTableName:
    Type: String
    Description: Existing DynamoDB table for flow meter readings (e.g., flostat-flowmeter-jitendera)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        FLOW_DEVICE_TABLE: !Ref FlowDeviceTableName
        FLOW_METER_TABLE: !Ref FlowMeterTableName
        FLOW_READINGS_TABLE: !Ref FlowMeterTableName
        FLOW_ROLLUPS_TABLE: !Ref FlowDeviceTableName

Resources:
  FlostatHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: FlostatHttpApi
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
          - HEAD
        MaxAge: 86400

  FlostatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.handler
      Description: Flostat Serverless Lambda Handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowDeviceTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FlowMeterTableName
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref FlostatHttpApi
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref FlostatHttpApi

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint URL
    Value: !Sub "https://${FlostatHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DeviceTableName:
    Description: Flostat Flow Device Table Name
    Value: !Ref FlowDeviceTableName
  MeterTableName:
    Description: Flostat Flow Meter Table Name
    Value: !Ref FlowMeterTableName
