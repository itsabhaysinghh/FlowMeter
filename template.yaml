AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Flostat Flow Meter Infrastructure
  AWS Region: ap-south-1 (Mumbai) | Account: 502830865576

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architecture: x86_64
    Environment:
      Variables:
        AWS_REGION: ap-south-1
        FLOW_DEVICE_TABLE: !Ref FlostatFlowDeviceTable
        FLOW_METER_TABLE: !Ref FlostatFlowMeterTable

Resources:
  # =================================================================
  # 1. DYNAMODB TABLES
  # =================================================================
  
  # Table 1: Device Metadata & Registration
  FlostatFlowDeviceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Flostat_Flow_Device_Table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: flow_meter_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: flow_meter_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: Production
        - Key: Project
          Value: Flostat

  # Table 2: Flow Metrics Time-Series Data
  FlostatFlowMeterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Flostat_Flow_Meter_Table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: flow_meter_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: flow_meter_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: Production
        - Key: Project
          Value: Flostat

  # =================================================================
  # 2. HTTP API GATEWAY
  # =================================================================
  FlostatHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: FlostatHttpApi
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  # =================================================================
  # 3. AWS LAMBDA BACKEND FUNCTION
  # =================================================================
  FlostatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.handler
      Description: Core serverless API for Flostat flow meter data ingestion & query
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlostatFlowDeviceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlostatFlowMeterTable
      Events:
        ApiRouteProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref FlostatHttpApi
        ApiRouteRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref FlostatHttpApi

Outputs:
  ApiEndpoint:
    Description: "Live HTTP API Gateway Endpoint URL (Mumbai ap-south-1)"
    Value: !Sub "https://${FlostatHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DeviceTableName:
    Description: "Flostat Flow Device Table Name"
    Value: !Ref FlostatFlowDeviceTable
  MeterTableName:
    Description: "Flostat Flow Meter Table Name"
    Value: !Ref FlostatFlowMeterTable
