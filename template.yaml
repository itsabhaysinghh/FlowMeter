AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Flostat Flow Meter Backend Serverless Stack

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        FLOW_DEVICE_TABLE: !Ref FlostatFlowDeviceTable
        FLOW_METER_TABLE: !Ref FlostatFlowMeterTable
        FLOW_READINGS_TABLE: !Ref FlostatFlowMeterTable
        FLOW_ROLLUPS_TABLE: !Ref FlostatFlowDeviceTable

Resources:
  FlostatFlowDeviceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: org_id
          AttributeType: S
        - AttributeName: flow_meter_id
          AttributeType: S
      KeySchema:
        - AttributeName: org_id
          KeyType: HASH
        - AttributeName: flow_meter_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FlostatFlowMeterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: flow_meter_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: flow_meter_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FlostatHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: FlostatHttpApi
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
          - HEAD
        MaxAge: 86400

  FlostatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.handler
      Description: Flostat Serverless Lambda Handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FlostatFlowDeviceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FlostatFlowMeterTable
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref FlostatHttpApi
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref FlostatHttpApi

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint URL
    Value: !Sub "https://${FlostatHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DeviceTableName:
    Description: Flostat Flow Device Table Name
    Value: !Ref FlostatFlowDeviceTable
  MeterTableName:
    Description: Flostat Flow Meter Table Name
    Value: !Ref FlostatFlowMeterTable
