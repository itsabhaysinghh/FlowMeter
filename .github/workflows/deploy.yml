name: Deploy Flostat AWS Serverless Infrastructure

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy to AWS (Mumbai ap-south-1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Security Scan Dependencies
        run: npm audit --audit-level=high || echo "Audit completed with warnings"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Ensure Dedicated Deployment Bucket Exists
        run: |
          aws s3api head-bucket --bucket flostat-deploy-502830865576-mumbai --region ap-south-1 2>/dev/null || \
          aws s3api create-bucket \
            --bucket flostat-deploy-502830865576-mumbai \
            --region ap-south-1 \
            --create-bucket-configuration LocationConstraint=ap-south-1 || echo "Deployment bucket already ready"

      - name: Clean Up Failed CloudFormation Rollback Stack
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name flostat-flow-serverless-stack --region ap-south-1 --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Current stack status: $STACK_STATUS"
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is in ROLLBACK_COMPLETE state from initial failed creation. Deleting..."
            aws cloudformation delete-stack --stack-name flostat-flow-serverless-stack --region ap-south-1
            aws cloudformation wait stack-delete-complete --stack-name flostat-flow-serverless-stack --region ap-south-1
            echo "Failed stack deleted successfully."
          fi

      - name: SAM Build Infrastructure
        run: sam build

      - name: SAM Deploy to AWS (Account 502830865576)
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name flostat-flow-serverless-stack \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --s3-bucket flostat-deploy-502830865576-mumbai \
            --s3-prefix flostat-backend

      - name: Print CloudFormation Failure Diagnostics
        if: failure()
        run: |
          echo "=== CloudFormation Failed Resource Events ==="
          aws cloudformation describe-stack-events \
            --stack-name flostat-flow-serverless-stack \
            --region ap-south-1 \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[LogicalResourceId, ResourceType, ResourceStatus, ResourceStatusReason]" \
            --output table || true
