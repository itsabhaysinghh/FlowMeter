name: Deploy Flostat AWS Serverless Infrastructure

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy to AWS (Mumbai ap-south-1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Security Scan Dependencies
        run: npm audit --audit-level=high || echo "Audit completed with warnings"

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Clean Up Rolled-Back Helper Stack
        run: |
          aws cloudformation delete-stack --stack-name aws-sam-cli-managed-default --region ap-south-1 || true
          aws cloudformation wait stack-delete-complete --stack-name aws-sam-cli-managed-default --region ap-south-1 || true

      - name: Ensure Deployment S3 Bucket Exists
        run: |
          aws s3api create-bucket \
            --bucket flostat-sam-bucket-502830865576 \
            --region ap-south-1 \
            --create-bucket-configuration LocationConstraint=ap-south-1 || true

      - name: SAM Build Infrastructure
        run: sam build

      - name: SAM Deploy to AWS (Account 502830865576)
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name flostat-flow-serverless-stack \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --s3-bucket flostat-sam-bucket-502830865576 \
            --s3-prefix flostat-backend
