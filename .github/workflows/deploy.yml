name: Deploy Flostat AWS Serverless Infrastructure

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy to AWS (Mumbai ap-south-1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: SAM Build Infrastructure
        run: sam build

      - name: SAM Deploy to AWS (Account 502830865576)
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name flostat-flow-serverless-stack \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3
